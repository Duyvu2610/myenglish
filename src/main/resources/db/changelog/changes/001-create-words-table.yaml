databaseChangeLog:
  - changeSet:
      id: 001-create-words-table
      author: codex
      changes:
        - createTable:
            tableName: words
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: english
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: vietnamese
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
